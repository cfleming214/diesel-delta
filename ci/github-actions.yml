# Move this file to .github/workflows/ci.yml to enable CI (the automation token
# that created it lacks the GitHub `workflow` scope).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run mock:typecheck
      - run: npm run mock:test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run functions:check
      - run: npm run functions:test
      # Applies supabase/migrations to the runner's Postgres and runs supabase/tests.
      - run: npm run db:check
