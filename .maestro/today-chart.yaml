appId: com.simpledesign.dieseldata
name: Scrub the Today chart, change window, set a lag
---
- runFlow: _onboard.yaml
- swipe:
    start: 90%, 45%
    end: 30%, 45%
    duration: 1500
- assertVisible: '.*Gap at Oct 26.*'
- tapOn: '30D'
- assertVisible: '.*over 30 days.*'
- tapOn: 'Chart'
- assertVisible: 'Lag: none'
- swipe:
    from:
      id: 'lag-slider'
    direction: RIGHT
- assertVisible: "Lag: \\d+ weeks?"
