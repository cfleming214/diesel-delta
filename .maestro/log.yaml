appId: com.simpledesign.dieseldata
name: Scan a receipt, enter a price manually, and keep both after a cold start
---
- runFlow: _onboard.yaml
- tapOn: 'Log'
- tapOn: 'Scan receipt'
- runFlow:
    when:
      visible: 'Allow camera'
    commands:
      - tapOn: 'Allow camera'
      - tapOn:
          text: 'Allow|OK|While using the app'
          optional: true
- tapOn: 'Capture'
- assertVisible: '4 of 4 lines selected'
- tapOn: 'BANANAS.*'
- tapOn: 'Add 3 prices'
- assertVisible: '3 prices added'
- tapOn: 'Enter manually'
- tapOn: 'Item'
- inputText: 'Oat milk 64 oz'
- tapOn: 'Price paid'
- inputText: '4.29'
- tapOn: 'Walmart'
- tapOn: 'Save price'
- assertVisible: 'Price saved'
- assertVisible: 'Oat milk 64 oz'
# Logged prices are kept on the device: they survive a cold start.
- stopApp
- launchApp
- tapOn: 'Log'
- assertVisible: 'Oat milk 64 oz'
- assertVisible: 'Walmart · .*'
